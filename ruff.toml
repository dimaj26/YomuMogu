# Ruff config — linter + formatter for the small Python surface
# (src/services/tokenizer/server.py, src/lib/dict/lookup.py).
# Conservative rule set: pyflakes (F) + pycodestyle errors (E4/E7/E9) only —
# no opinionated style churn on mature code. Wired into the pre-commit gate.
target-version = "py311"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]
